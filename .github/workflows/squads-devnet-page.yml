name: Squads devnet approval page

# Builds actions/squads-program-upgrade/web and publishes it with GitHub Pages
# at https://magicblock-labs.github.io/.github/. The page only reads public
# data and asks the member's own wallet to sign, so it needs no secrets.

on:
  push:
    branches: [main]
    paths:
      - actions/squads-program-upgrade/**
      - .github/workflows/squads-devnet-page.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/squads-program-upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:web

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: actions/squads-program-upgrade/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
