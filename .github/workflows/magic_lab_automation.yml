name: Magic Lab Project Automation

on:
  workflow_call:
    secrets:
      ADD_TO_PROJECT_PAT:
        description: Token used to update Magic Lab and close linked issues
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PROJECT_URL: https://github.com/orgs/magicblock-labs/projects/19
  PRIORITY_FIELD_ID: "21753053"

jobs:
  add-to-project:
    name: Add to GitHub Project
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'transferred'
    runs-on: ubuntu-latest
    concurrency:
      group: magic-lab-add-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Add item to Magic Lab
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const item = context.payload.issue ?? context.payload.pull_request;
            const projectUrl = new URL(process.env.PROJECT_URL);
            const [, , owner, , number] = projectUrl.pathname.split('/');
            const result = await github.graphql(`
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) { id }
                }
              }
            `, { owner, number: Number(number) });
            const projectId = result.organization.projectV2.id;

            async function findProjectItem() {
              let cursor = null;
              do {
                const result = await github.graphql(`
                  query($id: ID!, $cursor: String) {
                    node(id: $id) {
                      ... on Issue {
                        projectItems(first: 100, after: $cursor, includeArchived: true) {
                          nodes { id project { id } }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                      ... on PullRequest {
                        projectItems(first: 100, after: $cursor, includeArchived: true) {
                          nodes { id project { id } }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                `, { id: item.node_id, cursor });
                const items = result.node.projectItems;
                const existing = items.nodes.find(entry => entry.project.id === projectId);
                if (existing) return existing.id;
                if (!items.pageInfo.hasNextPage) return null;
                cursor = items.pageInfo.endCursor;
              } while (cursor);
              return null;
            }

            // Other repositories and native project automations can still race
            // with this job: concurrency groups only coordinate this repository.
            const maxAttempts = 5;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const existing = await findProjectItem();
              if (existing) {
                core.info('Item is already in Magic Lab');
                core.setOutput('itemId', existing);
                return;
              }

              try {
                const result = await github.graphql(`
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                      item { id }
                    }
                  }
                `, { projectId, contentId: item.node_id });
                core.setOutput('itemId', result.addProjectV2ItemById.item.id);
                core.info('Added item to Magic Lab');
                return;
              } catch (error) {
                const errors = error.errors ?? [{ message: error.message }];
                const conflict = errors.length > 0 && errors.every(entry =>
                  /content already exists in this project|concurrent project modification/i.test(entry.message)
                );
                if (!conflict) throw error;

                // A competing writer may have succeeded. Confirm membership
                // before treating a duplicate response as success.
                const existing = await findProjectItem();
                if (existing) {
                  core.info('Item was added to Magic Lab by another operation');
                  core.setOutput('itemId', existing);
                  return;
                }
                if (attempt === maxAttempts) throw error;
                const delay = 1000 * 2 ** (attempt - 1) + Math.floor(Math.random() * 1000);
                core.warning(`Project modification conflict; retrying in ${delay} ms (${attempt}/${maxAttempts})`);
                await new Promise(resolve => setTimeout(resolve, delay));
              }
            }

  assign-author:
    name: Assign unassigned item to its author
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Assign author
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const item = context.payload.issue ?? context.payload.pull_request;

            if (item.assignees?.length) {
              core.info(`Item already has ${item.assignees.length} assignee(s)`);
              return;
            }

            const author = item.user;
            if (!author || author.type === 'Bot' || author.login.endsWith('[bot]')) {
              core.info('Skipping assignment because the item author is a bot');
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: item.number,
                assignees: [author.login],
              });
            } catch (error) {
              if (error.status === 422) {
                core.warning(`Cannot assign ${author.login}: ${error.message}`);
                return;
              }
              throw error;
            }

  sync-priority:
    name: Sync priority label to issue field
    if: >-
      github.event_name == 'issues' &&
      (github.event.action == 'opened' ||
       github.event.action == 'labeled' ||
       github.event.action == 'unlabeled')
    runs-on: ubuntu-latest
    concurrency:
      group: priority-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Set Priority from P0-P3 label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PRIORITY_FIELD_ID: ${{ env.PRIORITY_FIELD_ID }}
        with:
          script: |
            const priorities = [
              ['p0', 'Urgent'],
              ['p1', 'High'],
              ['p2', 'Medium'],
              ['p3', 'Low'],
            ];
            const labels = new Set(
              context.payload.issue.labels.map(label =>
                (typeof label === 'string' ? label : label.name).toLowerCase()
              )
            );
            const changedLabel = context.payload.label?.name?.toLowerCase();
            const priorityLabels = new Set(priorities.map(([label]) => label));

            if (context.payload.action !== 'opened' && !priorityLabels.has(changedLabel)) {
              core.info(`Label ${changedLabel} does not control Priority`);
              return;
            }

            const selected = priorities.find(([label]) => labels.has(label));
            const fieldId = Number(process.env.PRIORITY_FIELD_ID);
            const route = '/repos/{owner}/{repo}/issues/{issue_number}/issue-field-values';
            const parameters = {
              ...context.repo,
              issue_number: context.payload.issue.number,
              headers: {
                accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2026-03-10',
              },
            };

            if (selected) {
              const [, value] = selected;
              await github.request(`POST ${route}`, {
                ...parameters,
                issue_field_values: [{ field_id: fieldId, value }],
              });
              core.info(`Set Priority to ${value}`);
              return;
            }

            if (context.payload.action !== 'unlabeled') {
              core.info('No priority label is set; leaving Priority unchanged');
              return;
            }

            try {
              await github.request(`DELETE ${route}/{issue_field_id}`, {
                ...parameters,
                issue_field_id: fieldId,
              });
              core.info('Cleared Priority because no P0-P3 label remains');
            } catch (error) {
              if (error.status === 404) {
                core.info('Priority was already empty');
                return;
              }
              throw error;
            }

  close-linked-issues:
    name: Close linked issues after merge
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes {
                        number
                        state
                        repository {
                          name
                          owner {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              ...context.repo,
              number: context.payload.pull_request.number,
            });

            const issues = result.repository.pullRequest.closingIssuesReferences.nodes;
            if (!issues.length) {
              core.info('The merged pull request has no linked issues');
              return;
            }

            for (const issue of issues) {
              if (issue.state !== 'OPEN') {
                core.info(`${issue.repository.owner.login}/${issue.repository.name}#${issue.number} is already closed`);
                continue;
              }

              await github.rest.issues.update({
                owner: issue.repository.owner.login,
                repo: issue.repository.name,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed ${issue.repository.owner.login}/${issue.repository.name}#${issue.number}`);
            }
